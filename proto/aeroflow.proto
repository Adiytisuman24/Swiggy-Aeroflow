syntax = "proto3";

package aeroflow;

option go_package = "github.com/aeroflow/proto";

service IntelligenceService {
  rpc GetRecommendation (RecommendationRequest) returns (RecommendationResponse);
  rpc PredictDepletion (DepletionRequest) returns (DepletionResponse);
}

message RecommendationRequest {
  string user_id = 1;
  string context = 2; // e.g. "rainy weather", "after workout"
}

message RecommendationResponse {
  repeated string items = 1;
  float confidence_score = 2;
  string reasoning = 3;
}

message DepletionRequest {
  string user_id = 1;
  repeated string tracked_items = 2;
}

message DepletionResponse {
  message DepletedItem {
    string item_name = 1;
    string predicted_date = 2;
  }
  repeated DepletedItem items = 1;
}
