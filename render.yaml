services:
  # 1. AeroFlow Go Core Orchestrator Backend
  - type: web
    name: aeroflow-core
    env: docker
    repo: https://github.com/Adiytisuman24/Swiggy-Aeroflow
    branch: main
    dockerfilePath: core/Dockerfile
    dockerContext: core
    envVars:
      - key: PORT
        value: 8080
      - key: AI_SERVICE_URL
        value: https://aeroflow-ai.onrender.com
      - key: GIN_MODE
        value: release

  # 2. AeroFlow Python AI Service Backend
  - type: web
    name: aeroflow-ai
    env: docker
    repo: https://github.com/Adiytisuman24/Swiggy-Aeroflow
    branch: main
    dockerfilePath: ai/Dockerfile
    dockerContext: ai
    envVars:
      - key: PORT
        value: 8000

  # 3. AeroFlow Next.js Frontend (Render fallback - Vercel is preferred for web)
  - type: web
    name: aeroflow-web
    env: docker
    repo: https://github.com/Adiytisuman24/Swiggy-Aeroflow
    branch: main
    dockerfilePath: web/Dockerfile
    dockerContext: web
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://aeroflow-core.onrender.com
